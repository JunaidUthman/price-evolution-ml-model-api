name: Price API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'main.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies & testing tools
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system pytest pytest-mock -r requirements.txt

      - name: Run Unit Tests
        env:
          HF_TOKEN: "mock-token"
          HF_REPO_ID: "mock/repo"
          MODEL_FILENAME: "model.pkl"
        run: |
          pytest tests/ -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short Git SHA for tagging
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/product-price-api
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:v-${{ steps.vars.outputs.sha_short }}

      - name: Checkout Infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: JunaidUthman/product-intelligence-K8s-Infrastructure
          token: ${{ secrets.INFRA_PAT }}
          path: infra-repo

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tag in Kubernetes Infrastructure repository
        env:
          IMAGE_TAG: v-${{ steps.vars.outputs.sha_short }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd infra-repo/base

          # Use kustomize to set the new image tag
          kustomize edit set image junaiduthman/product-price-api=junaiduthman/product-price-api:${IMAGE_TAG}

          # Commit and push changes
          git add kustomization.yaml
          git diff --staged --quiet || (git commit -m "chore(gitops): update product-price-api image to ${IMAGE_TAG}" && git push)

